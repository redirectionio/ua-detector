# A bot announces itself with a token somewhere in its user agent, and nothing else in the
# result can be derived: name, category and producer only exist as data. Ordered as matomo
# orders its rules, reversed, since it stops at the first match and a merge keeps the last.

- regex: .*(?:panse |ello f|panse,).*
  bot:
    name: Cortex Xpanse
    category: Security Checker
    url: https://docs-cortex.paloaltonetworks.com/r/1/Cortex-Xpanse/Scanning-activity
    producer:
      name: Palo Alto Networks, Inc.
      url: https://www.paloaltonetworks.com/
