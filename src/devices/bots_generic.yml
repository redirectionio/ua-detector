---

# The tokens a crawler gives itself away with, one entry each so the tree can prune them by
# their own literal, all below every named bot.
#
# The lookarounds matomo writes them with -- `(?<!cu)bot`, `spider(?! 8)` -- are written out as
# the alternation of everything they leave: a prefix that does not end with `cu`, a suffix that
# does not open on ` 8`. The trailing `(?:|[^a-z].*)` is the word end, without which `bot` reads
# the `botox` in a clinic's user agent.

-
  regex: '(?:|.*[^ _u]|(?:|.*[^mr]|(?:|.*[^e]|(?:|.*[^w]|(?:|.*[^o]|(?:|.*[^p])o)w)e)r) |(?:|.*[^mr]|(?:|.*[^e]|(?:|.*[^w]|(?:|.*[^o]|(?:|.*[^p])o)w)e)r)_|(?:|.*[^Hc])u)bot(?:|[^a-z 5_].*| (?:|[^5JST].*|5(?:|[^0123456789].*)|J(?:|[^u].*|u(?:|[^n].*|n(?:|[^i].*|i(?:|[^o].*|o(?:|[^r].*)))))|S(?:|[^e].*|e(?:|[^n].*|n(?:|[^i].*|i(?:|[^o].*|o(?:|[^r].*)))))|T(?:|[^A].*|A(?:|[^B].*)))|5(?:|[^0123456789].*)|_(?:|[^5JST].*|5(?:|[^0123456789].*)|J(?:|[^u].*|u(?:|[^n].*|n(?:|[^i].*|i(?:|[^o].*|o(?:|[^r].*)))))|S(?:|[^e].*|e(?:|[^n].*|n(?:|[^i].*|i(?:|[^o].*|o(?:|[^r].*)))))|T(?:|[^A].*|A(?:|[^B].*))))'
  priority: -4
  bot:
    name: Generic Bot

-
  regex: '(?:|.*[^-]|(?:|.*[^ent]|(?:|.*[^d]|(?:|.*[^o]|(?:|.*[^n])o)d)e|(?:|.*[^o]|(?:|.*[^r]|(?:|.*[^t]|(?:|.*[^c]|(?:|.*[^e]|(?:|.*[^l]|(?:|.*[^e])l)e)c)t)r)o)n|(?:|.*[^n]|(?:|.*[^e]|(?:|.*[^i]|(?:|.*[^l]|(?:|.*[^c]|(?:|.*[^u])c)l)i)e)n)t)-)fetch(?:er)?(?:|[^a-z].*)'
