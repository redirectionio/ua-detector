# The convention a crawler names itself in: the compatibility comment, a token with a version,
# and the address of a page explaining what it is --
#
#   Mozilla/5.0 (compatible; Diffbot/1.0; +https://diffbot.com)
#
# Last at this priority, so it beats the tokens above -- a name is worth more than the `bot` in
# it -- and below every named bot, which spells it better. The address is required, and is what
# keeps browsers out: no comment a browser writes names a page.
-
  regex: '.*\(compatible; (?<bot_name>[A-Za-z][\w.-]*)(?:/[\d.]+)?;\s*\+?(?<bot_url>https?://[^);\s]+).*'
  priority: -4
  bot:
    name: '{bot_name}'
    url: '{bot_url}'
