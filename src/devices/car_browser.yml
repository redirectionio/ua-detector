---

# Tesla, whose head unit only identifies itself through a trailing build tag
-
  regex: 'Mozilla/5\.0 \(X11; GNU/Linux\) AppleWebKit/537\.36 \(KHTML, like Gecko\) Chromium/(?<client_version>[\d.]+) Chrome/[\d.]+ Safari/537\.36 Tesla/\S+'
  os:
    name: GNU/Linux
    version: ""
    platform: ""
  client:
    type: browser
    name: Chromium
    version: "{client_version}"
    engine: Blink
    engine_version: "{client_version}"
  device:
    type: car browser
    brand: Tesla
    model: ""
  os_family: GNU/Linux
  browser_family: Chrome

-
  regex: 'Mozilla/5\.0 \(X11; Linux x86_64\) AppleWebKit/537\.36 \(KHTML, like Gecko\) Chrome/(?<client_version>[\d.]+) Safari/537\.36 Tesla/\S+'
  os:
    name: GNU/Linux
    version: ""
    platform: x64
  client:
    type: browser
    name: Chrome
    version: "{client_version}"
    engine: Blink
    engine_version: "{client_version}"
  device:
    type: car browser
    brand: Tesla
    model: ""
  os_family: GNU/Linux
  browser_family: Chrome

-
  regex: 'Mozilla/5\.0 \(X11; u; Linux; C\) AppleWebKit /(?<engine_version>[\d.]+) \(Khtml, like Gheko\) QtCarBrowser Safari/[\d.]+'
  os:
    name: GNU/Linux
    version: ""
    platform: ""
  client:
    type: browser
    name: Safari
    version: ""
    engine: WebKit
    engine_version: "{engine_version}"
  device:
    type: car browser
    brand: Tesla
    model: Model S
  os_family: GNU/Linux
  browser_family: Safari

