---

# Chrome on Android 10+ freezes its user agent to `Android 10; K` and moves the real operating
# system version and device model into client hints, so every entry below matches the very
# same user agent and is told apart by its headers alone.

# DuckDuckGo announces itself in the brand list while still calling itself Chrome in the user
# agent, so it has to come before the plain Chrome entries.
-
  regex: 'Mozilla/5\.0 \(Linux; Android [\d.]+; K\) AppleWebKit/537\.36 \(KHTML, like Gecko\) Chrome/[\d.]+ Mobile Safari/537\.36'
  headers:
    sec-ch-ua: 'DuckDuckGo'
    sec-ch-ua-platform-version: '^(?<os_version>[\d.]+)$'
    sec-ch-ua-full-version: '^(?<engine_version>[\d.]+)$'
    sec-ch-ua-model: '^DG101HSTB$'
  os: {name: Android, version: "{os_version}", platform: ""}
  client: {type: browser, name: DuckDuckGo Privacy Browser, version: "", engine: Blink, engine_version: "{engine_version}"}
  device: {type: tablet, brand: DGTEC, model: DG101HSTB}
  os_family: Android
  browser_family: Chrome

-
  regex: 'Mozilla/5\.0 \(Linux; Android [\d.]+; K\) AppleWebKit/537\.36 \(KHTML, like Gecko\) Chrome/[\d.]+ Mobile Safari/537\.36'
  headers:
    sec-ch-ua: 'DuckDuckGo'
    sec-ch-ua-platform-version: '^(?<os_version>[\d.]+)$'
    sec-ch-ua-full-version: '^(?<engine_version>[\d.]+)$'
    sec-ch-ua-model: '^SCG22$'
  os: {name: Android, version: "{os_version}", platform: ""}
  client: {type: browser, name: DuckDuckGo Privacy Browser, version: "", engine: Blink, engine_version: "{engine_version}"}
  device: {type: phablet, brand: Samsung, model: Galaxy Z Fold 5}
  os_family: Android
  browser_family: Chrome

# When the platform version hint is empty the user agent keeps the last word
