  headers:
    sec-ch-ua-platform-version: '^$'
    sec-ch-ua-full-version: '^(?<client_version>[\d.]+)$'
    sec-ch-ua-model: '^22071219CG$'
  os: {name: Android, version: "{os_version}", platform: ""}
  client: {type: browser, name: Chrome Mobile, version: "{client_version}", engine: Blink, engine_version: "{client_version}"}
  device: {type: smartphone, brand: POCO, model: M5}
