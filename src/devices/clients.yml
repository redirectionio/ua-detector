---

# The client axis: an entry reads the token a client writes to name itself and says nothing
# about the system or the device. Priority -2, above the platform axis and below every entry
# that recognises a whole user agent.
#
# Ordered by how much each knows, least first: the last to match wins.

# Where a user agent lands that has named no client at all. All at -4, below everything that
# names one.

-
  regex: '.*Macintosh.*'
  priority: -4
  client: {type: browser, name: 'Safari', version: ""}
  browser_family: 'Safari'

-
  regex: '.*(?:com\.apple\.WebKit\.Networking|com\.apple\.AuthenticationServicesCore\.AuthenticationServicesAgent|NetworkingExtension)/(?<client_version>\d+[.\d]+).+ (?:CF)?Network.*'
  priority: -4
  client: {type: browser, name: 'Safari', version: "{client_version}"}
  browser_family: 'Safari'

# Split in two for the version. The prefix is `(?<!SmartTV )` written out: a Samsung television
# says `SmartTV Safari/531.2+` and is not a Safari.
-
  regex: '(?:|.*[^ ]|(?:|.*[^V]|(?:|.*[^T]|(?:|.*[^t]|(?:|.*[^r]|(?:|.*[^a]|(?:|.*[^m]|(?:|.*[^S])m)a)r)t)T)V) )Safari/?\d+.*'
  priority: -4
  client: {type: browser, name: 'Safari', version: ""}
  browser_family: 'Safari'

-
  regex: '.*Version/(?<client_version>\d+\.[.\d]+) .*Safari/.*'
  priority: -4
  client: {type: browser, name: 'Safari', version: "{client_version}"}
  browser_family: 'Safari'

# An Apple platform that names no client runs the browser that comes with it. The token opens a
# word and does not follow a space: `Tiphone T67`, `Apple-iPhone5C2` and `(Apple TV; U; CPU
# iPhone OS ...)` are none of them an iPhone.
-
  regex: '(?:.*[^a-z0-9 _-])?(?:iPod|iPhone|iPad).*'
  priority: -4
  client: {type: browser, name: 'Mobile Safari', version: ""}
  browser_family: 'Safari'

# A Safari that says `Mobile` is the handheld one, whatever the platform claims: an iPad asked
# for the desktop site sends `Macintosh` and `Mobile/15E148` in the same string.
-
  regex: '.*Mobile.*Safari/.*'
  priority: -4
  client: {type: browser, name: 'Mobile Safari', version: ""}
  browser_family: 'Safari'

-
  regex: '.*Version/(?<client_version>\d+\.[.\d]+) .*Mobile.*Safari/.*'
  priority: -4
  client: {type: browser, name: 'Mobile Safari', version: "{client_version}"}
  browser_family: 'Safari'

-
  regex: '.*NetworkingExtension/.+ Network/.+ iOS/(?<client_version>\d+[.\d]+).*'
  priority: -4
  client: {type: browser, name: 'Mobile Safari', version: "{client_version}"}
  browser_family: 'Safari'

-
  regex: '.*(?:(?:iPod|iPad|iPhone).+Version|MobileSafari)/(?<client_version>[\d.]+).*'
  priority: -4
  client: {type: browser, name: 'Mobile Safari', version: "{client_version}"}
  browser_family: 'Safari'

# The token opens a word and does not follow ` like `, written out as every prefix that
# satisfies both. The hyphen is a word character here: `Orca-Android` is a Messenger build.
-
  regex: '(?:|.*[^a-z0-9_ -]|(?:|.*[^e]|(?:|.*[^k]|(?:|.*[^i]|(?:|.*[^l]|(?:|.*[^ ])l)i)k)e) )Android(?:[^.].*|$)'
  priority: -4
  client: {type: browser, name: 'Android Browser', version: ""}
  browser_family: 'Android Browser'

# The token alone, with the version if it is there: `CHROME 152.0.0` is a Chrome. First of the
# three so the two that read a version overwrite it. `(?!book)` is written out: a Chromebook is
# a machine.
-
  regex: '.*Chrome(?:[^b].*|b(?:[^o].*|o(?:[^o].*|o(?:[^k].*|$)|$)|$)|$)'
  priority: -2
  client: {type: browser, name: 'Chrome', version: ""}
  browser_family: 'Chrome'

-
  regex: '.*Chrome/(?<client_version>[\d.]+).*'
  priority: -2
  client: {type: browser, name: 'Chrome', version: "{client_version}"}
  browser_family: 'Chrome'

-
  regex: '.*HeadlessChrome/(?<client_version>[\d.]+).*'
  priority: -2
  client: {type: browser, name: 'Headless Chrome', version: "{client_version}"}
  browser_family: 'Chrome'

-
  regex: '.*Chrome/(?<client_version>[\d.]+) Mobile.*'
  priority: -2
  client: {type: browser, name: 'Chrome Mobile', version: "{client_version}"}
  browser_family: 'Chrome'

# A WebView says so either by `wv)` in the platform token or by the Version/ that the Android
# system browser writes, whichever comes before the Chrome build.
-
  regex: '.*(?: wv\)|Version/[\d.]+ ).*Chrome/(?<client_version>[\d.]+).*'
  priority: -2
  client: {type: browser, name: 'Chrome Webview', version: "{client_version}"}
  browser_family: 'Chrome'

-
  regex: '.*(?:MQQBrowser|QQBrowser|MQBHD)/(?<client_version>[\d.]+).*'
  priority: -2
  client: {type: browser, name: 'QQ Browser', version: "{client_version}"}
  browser_family: 'Unknown'

-
  regex: '.*(?:MQQBrowser|QQBrowser|MQBHD)/(?<client_version>[\d.]+).*'
