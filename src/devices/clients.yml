-
  regex: '.*MSIE ?(?<client_version>[\d.]+).*'
  priority: -2
  client: {type: browser, name: 'Internet Explorer', version: "{client_version}"}
  browser_family: 'Internet Explorer'

-
  regex: '.*Trident/7\.0.*'
  priority: -2
  client: {type: browser, name: 'Internet Explorer', version: '11.0'}
  browser_family: 'Internet Explorer'

# Clients the traffic holds that the generated axis has, at -3, under the Chrome and Safari
# entries above. Promoting matomo's thousand tokens wholesale costs more than it pays; these are
# the ones that turn up often enough to be worth writing out.
-
  regex: '.*(?:UP\.Browser|Openwave)/(?<client_version>[\d.]+).*'
  priority: -2
  client: {type: browser, name: 'Openwave Mobile Browser', version: "{client_version}"}
  browser_family: 'Unknown'

-
  regex: '.*(?:OPR|OPiOS)/(?<client_version>[\d.]+).*'
