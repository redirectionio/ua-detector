---

# Every client the corpus knows, generated from `regexes/client/*.yml` of the pinned revision.
#
# Matomo tries its parsers in the order FeedReader, MobileApp, MediaPlayer, PIM, Browser,
# Library, and inside each its rules top to bottom, stopping at the first that matches. This
# merges every entry that matches and keeps the last, so both orders are turned around -- which
# is also why an app beats the browser its WebView reports. Rules using a lookaround, a
# backreference or an anchor are left out: the regex crate compiles none of them.
#
# Priority -3, under `clients.yml`: many of these name themselves with a token short or common
# enough to turn up inside another string, so they only answer where nothing else does.

-
  regex: '.*(?:nscurl).*'
  priority: -3
  client: {type: library, name: 'nscurl', version: ""}

