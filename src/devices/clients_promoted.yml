---

# Clients lifted above the generic browsers.
#
# `clients_fallback.yml` has these at -3, under the Chrome and Safari entries of
# `clients.yml`, which is the right way round for most of matomo's thousand-odd tokens and
# the wrong way round for the ones that turn up. Only tokens of seven characters or more: the
# short ones read inside other strings often enough to cost more than they pay.

-
  regex: '.*AppleCoreMedia/1\.0\.0.*'
  priority: -2
  client: {type: library, name: 'iOS Application', version: ""}
-
  regex: '.*Cypress/(?<client_version>\d+[.\d]+).*'
