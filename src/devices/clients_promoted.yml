# An application built on AFNetworking, which writes the platform between brackets and its own
# name before the version.
-
  regex: '(?s:.*?)(?<client_name>[^/;]*)/(?<client_version>\d+\.[\d.]+) \((?:iPhone|iPad); (?:iOS|iPadOS) [\d.]+; Scale/[\d.]+\).*'
  priority: -2
  client: {type: 'mobile app', name: '{client_name}', version: '{client_version}'}

# An application that names itself in a field of its own.
-
  regex: '.*AppVersion/(?<client_version>[\d.]+).+appname/(?<client_name>[^/; ]+).*'
  priority: -2
  client: {type: 'mobile app', name: '{client_name}', version: '{client_version}'}

# Named applications the three rules above would otherwise answer for, a captured token being
# only ever what the string spells: `obsidian` for Obsidian, `LINE` for Line.
-
  regex: '.*obsidian/(?<client_version>[\d.]+).*'
  priority: -2
  client: {type: 'mobile app', name: 'Obsidian', version: "{client_version}"}

-
  regex: '.*(?:maglev|Teams)/(?<client_version>\d+[.\d]+).*'
  priority: -2
  client: {type: 'mobile app', name: 'Teams', version: "{client_version}"}

-
  regex: '.*\bLine[ /](?<client_version>[\d.]+).*'
  priority: -2
  client: {type: mobile app, name: 'Line', version: "{client_version}"}
  browser_family: 'Unknown'

