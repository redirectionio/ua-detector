---

# Archos Gamepad
-
  regex: 'Mozilla/5\.0 \(Linux; Android (?<os_version>[\d.]+); ARCHOS GAMEPAD Build/\w+\) AppleWebKit/(?<engine_version>[\d.]+) \(KHTML, like Gecko\) Chrome/(?<client_version>[\d.]+) Safari/[\d.]+'
  os:
    name: Android
    version: "{os_version}"
    platform: ""
  client:
    type: browser
    name: Chrome
    version: "{client_version}"
    engine: WebKit
    engine_version: "{engine_version}"
  device:
    type: console
    brand: Archos
    model: Gamepad
  os_family: Android
  browser_family: Chrome

-
  regex: 'Mozilla/5\.0 \(Linux; U; Android (?<os_version>[\d.]+); [a-z]{2}-[a-z]{2}; ARCHOS GAMEPAD(?<model>\d) Build/\w+\) AppleWebKit/(?<engine_version>[\d.]+) \(KHTML, like Gecko\) Version/4\.0 Safari/[\d.]+'
  os:
    name: Android
    version: "{os_version}"
    platform: ""
  client:
    type: browser
    name: Android Browser
    version: ""
    engine: WebKit
    engine_version: "{engine_version}"
  device:
    type: console
    brand: Archos
    model: Gamepad {model}
  os_family: Android
  browser_family: Android Browser

