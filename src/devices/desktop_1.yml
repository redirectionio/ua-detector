---

# Client hints win over the user agent: `sec-ch-ua-platform-version` 15 is Windows 11, which
# the user agent still calls Windows NT 10.0.
-
  regex: 'Mozilla/5\.0 \(Windows NT 10\.0; Win64; x64\) AppleWebKit/537\.36 \(KHTML, like Gecko\) Chrome/(?<client_version>[\d.]+) Safari/537\.36'
  headers:
    sec-ch-ua-platform: '^Windows$'
    sec-ch-ua-platform-version: '^"?(?<os_version>1[3-9])"?$'
    sec-ch-ua-model: '^"(?<model>[^"]+)"$'
  os: {name: Windows, version: "11", platform: x64}
  client: {type: browser, name: Chrome, version: "{client_version}", engine: Blink, engine_version: "{client_version}"}
  device: {type: desktop, brand: Microsoft, model: "{model}"}
  os_family: Windows
  browser_family: Chrome

-
  regex: 'Mozilla/5\.0 \(Linux; Android (?<os_version>[\d.]+); 20JJS0CU1M\) AppleWebKit/537\.36 \(KHTML, like Gecko\) Chrome/(?<client_version>[\d.]+) Safari/537\.36'
  os: {name: Android, version: "{os_version}", platform: ""}
  client: {type: browser, name: Chrome, version: "{client_version}", engine: Blink, engine_version: "{client_version}"}
  device: {type: desktop, brand: Lenovo, model: ThinkPad Yoga 370}
  os_family: Android
  browser_family: Chrome

-
  regex: 'Mozilla/5\.0 \(Linux; Android (?<os_version>[\d.]+); AfriOne 2in1\) AppleWebKit/537\.36 \(KHTML, like Gecko\) Chrome/(?<client_version>[\d.]+) Safari/537\.36'
  os: {name: Android, version: "{os_version}", platform: ""}
  client: {type: browser, name: Chrome, version: "{client_version}", engine: Blink, engine_version: "{client_version}"}
  device: {type: desktop, brand: AfriOne, model: Transformer}
  os_family: Android
  browser_family: Chrome

-
  regex: 'Mozilla/5\.0 \(Macintosh; Intel Mac OS X (?<os_version>[\d_]+)\) AppleWebKit/(?<engine_version>[\d.]+) \(KHTML, like Gecko\) Version/[\d.]+ DuckDuckGo/(?<client_version>\d+) Safari/[\d.]+'
  os: {name: Mac, version: "{os_version|dots}", platform: ""}
  client: {type: browser, name: DuckDuckGo Privacy Browser, version: "{client_version}", engine: WebKit, engine_version: "{engine_version}"}
  device: {type: desktop, brand: Apple, model: ""}
  os_family: Mac
  browser_family: Chrome

# The trailing letters of a Puffin version say how the browser runs, `D` meaning desktop
-
  regex: 'Mozilla/5\.0 \(X11; U; Linux aarch64\) AppleWebKit/537\.36 \(KHTML, like Gecko\) Chrome/(?<engine_version>[\d.]+) Safari/537\.36 Puffin/(?<client_version>[\d.]+)[A-Z]*D'
  os: {name: GNU/Linux, version: "", platform: ARM}
  client: {type: browser, name: Puffin Secure Browser, version: "{client_version}", engine: Blink, engine_version: "{engine_version}"}
  device: {type: desktop, brand: "", model: ""}
  os_family: GNU/Linux
  browser_family: Chrome

