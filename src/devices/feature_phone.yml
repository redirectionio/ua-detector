  os: {name: KaiOS, version: "{os_version}", platform: ""}
  client: {type: browser, name: Firefox Mobile, version: "{client_version}", engine: Gecko, engine_version: "{client_version}"}
  device: {type: feature phone, brand: 'FISE', model: 'M32433 3G'}
  os_family: Firefox OS
  browser_family: Firefox

