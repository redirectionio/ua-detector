---

-
  regex: 'Mozilla/5\.0 \(X11; Linux x86_64\) AppleWebKit/[\d.]+ \(KHTML, like Gecko\) akregator/(?<client_version>[\d.]+) Safari/[\d.]+'
  os:
    name: GNU/Linux
    version: ""
    platform: x64
  client:
    type: feed reader
    name: Akregator
    version: "{client_version}"
  device:
    type: desktop
    brand: ""
    model: ""
  os_family: GNU/Linux
  browser_family: Unknown

