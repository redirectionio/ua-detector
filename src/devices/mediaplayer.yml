# Songbird and its Nightingale fork share the same Gecko based user agent
-
  regex: 'Mozilla/5\.0 \(X11; U; Linux i686; [a-z]{2}-[A-Z]{2}; rv:[\d.]+\) Gecko/\d+ (?<client_name>Songbird|Nightingale)/(?<client_version>[\d.]+) \(\d+\)'
  os:
    name: GNU/Linux
    version: ""
    platform: x86
  client:
    type: mediaplayer
    name: "{client_name}"
    version: "{client_version}"
  device:
    type: desktop
    brand: ""
    model: ""
  os_family: GNU/Linux
  browser_family: Unknown

-
  regex: 'iTunes/(?<client_version>[\d.]+) \(Macintosh; Intel Mac OS X (?<os_version>[\d.]+)\) AppleWebKit/[\d.]+'
  os:
    name: Mac
    version: "{os_version}"
    platform: ""
  client:
    type: mediaplayer
    name: iTunes
    version: "{client_version}"
  device:
    type: desktop
    brand: Apple
    model: ""
  os_family: Mac
  browser_family: Unknown

-
  regex: 'iTunes/(?<client_version>[\d.]+) \(Windows; Microsoft Windows (?<os_version>\d+) [^)]+\(Build \d+\)\) AppleWebKit/[\d.]+'
