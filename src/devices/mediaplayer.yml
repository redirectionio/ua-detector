# Darwin 13.3 is Mac OS X 10.9.4, and MacBookAir4,2 is the 2011 13 inch model
-
  regex: 'Downcast/\d+ CFNetwork/[\d.]+ Darwin/13\.3\.0 \(x86_64\) \(MacBookAir4%2C2\)'
  os:
    name: Mac
    version: "10.9.4"
    platform: x64
  client:
    type: mediaplayer
    name: Downcast
    version: ""
  device:
    type: desktop
    brand: Apple
    model: 'MacBook Air 13" (2011)'
  os_family: Mac
  browser_family: Unknown

