---

# Players that say nothing about the machine they run on
-
  regex: 'Audacious/(?<client_version>[\d.]+) neon/[\d.]+'
  client:
    type: mediaplayer
    name: Audacious
    version: "{client_version}"
  device: {}
  os_family: Unknown
  browser_family: Unknown

-
  regex: 'NSPlayer/(?<client_version>[\d.]+) WMFSDK/[\d.]+'
  client:
    type: mediaplayer
    name: Windows Media Player
    version: "{client_version}"
  device: {}
  os_family: Unknown
  browser_family: Unknown

-
  regex: 'Music Player Daemon (?<client_version>[\d.]+)'
  client:
    type: mediaplayer
    name: Music Player Daemon
    version: "{client_version}"
  device: {}
  os_family: Unknown
  browser_family: Unknown

-
  regex: 'mpv (?<client_version>[\d.]+)'
