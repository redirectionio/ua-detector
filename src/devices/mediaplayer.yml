# Next set top boxes running VLC. The model is the token before `_VLC`, except for the 2000 HD
# which the firmware writes with a dash.
-
  regex: 'NEXT 2000-HD_VLC/(?<client_version>[\d.]+) LibVLC/[\d.]+'
  os:
    name: RTOS & Next
    version: ""
    platform: ""
  client:
    type: mediaplayer
    name: VLC
    version: "{client_version}"
  device:
    type: tv
    brand: Next & NextStar
    model: 2000 HD
  os_family: Real-time OS
  browser_family: Unknown

-
  regex: 'NEXT 2000-HD PLUS_VLC/(?<client_version>[\d.]+) LibVLC/[\d.]+'
  os:
    name: RTOS & Next
    version: ""
    platform: ""
  client:
    type: mediaplayer
    name: VLC
    version: "{client_version}"
  device:
    type: tv
    brand: Next & NextStar
    model: 2000 HD Plus
  os_family: Real-time OS
  browser_family: Unknown

-
  regex: 'NEXT (?<model>[A-Za-z0-9\- ]+)_VLC/(?<client_version>[\d.]+) LibVLC/[\d.]+'
  priority: -2
  os:
    name: RTOS & Next
    version: ""
    platform: ""
  client:
    type: mediaplayer
    name: VLC
    version: "{client_version}"
  device:
    type: tv
    brand: Next & NextStar
    model: "{model}"
  os_family: Real-time OS
  browser_family: Unknown
