# Facebook, on a device the corpus never recorded. 311 entries carry an FB token and each was cut
# per fixture, freezing the model and the Chrome build alongside it. Matomo needs two rules for
# this app -- one on `FBAV`, one on `FBAN|FBSV|FBID|FBBV` -- because it matches the client apart
# from the device and composes the two; an entry here has to answer for the whole string at once,
# so what is wanted is one per platform rather than one per phone.
#
# The app writes its own version at FBAV. The four shapes are the native Android app, which
# carries no Mozilla prefix at all and gives its Android version at FBSV, the Android WebView
# under FB_IAB, and iPhone and iPad under FBAN/FBIOS.
-
  regex: '\[FBAN/FB4A;FBAV/(?<client_version>[\d.]+);.*FBSV/(?<os_version>[\d.]+);.*'
  priority: -2
  os: {name: Android, version: "{os_version}", platform: ""}
  client: {type: mobile app, name: Facebook, version: "{client_version}"}
  device: {type: smartphone}
  os_family: Android
  browser_family: Unknown

