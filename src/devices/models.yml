# Xiaomi's televisions: `MiTV-` names the family, the code that follows names the set.
-
  regex: '.*\bMiTV-\w.*'
  priority: -1
  device: {type: 'tv', brand: 'Xiaomi'}

-
  regex: '.*\bMiTV-AFKR0(?:[);/ ].*|$)'
  priority: -1
  device: {type: 'tv', brand: 'Xiaomi', model: 'TV Box S (2nd Gen)'}

# Xiaomi's television box.
-
  regex: '.*\bMIBOX(?<model>[234])(?:[);/ ].*|$)'
  priority: -1
  device: {type: 'tv', brand: 'Xiaomi', model: 'Mi Box {model}'}

# Google's television dongle, which says Android and no more about the machine.
-
  regex: '.*\bChromecast(?:[);/ _].*|$)'
  priority: -1
  device: {type: 'tv', brand: 'Google', model: 'Chromecast (2020)'}

-
  regex: '.*\bChromecast HD.*'
  priority: -1
  device: {type: 'tv', brand: 'Google', model: 'Chromecast HD (2022)'}

# A television box that runs Android and says so.
-
  regex: '.*\bUGOOS[-_ ].*'
  priority: -1
  device: {type: 'tv', brand: 'Ugoos'}

# A console says which one it is and nothing else. Most specific last.
-
  regex: '.*\bXbox.*'
  priority: -1
  device: {type: 'console', brand: 'Microsoft', model: 'Xbox 360'}

-
  regex: '.*\bXbox One.*'
  priority: -1
  device: {type: 'console', brand: 'Microsoft', model: 'Xbox One'}

-
  regex: '.*\bXbox One X.*'
  priority: -1
  device: {type: 'console', brand: 'Microsoft', model: 'Xbox One X'}

-
  regex: '.*\bXBOX_ONE_ED.*'
  priority: -1
  device: {type: 'console', brand: 'Microsoft', model: 'Xbox One S'}

-
  regex: '.*\bXbox Series X.*'
  priority: -1
  device: {type: 'console', brand: 'Microsoft', model: 'Xbox Series X'}

# An LG television names its firmware and nothing else. `NetCast.TV` is the browser of that
# name, not the set.
-
  regex: '.*(?:LGE_DLNA_SDK.*|NetCast(?:[^.].*|\.[^T].*|\.T[^V].*|$))'
  priority: -1
  device: {type: 'tv', brand: 'LG', model: 'NetCast'}

# Televisions whose model token says nothing about being one.
-
  regex: '.*[(;] ?AI PONT[;)].*'
  priority: -1
  device: {type: 'tv'}

-
  regex: '.*BRAVIA.*'
  priority: -1
  device: {type: 'tv'}
