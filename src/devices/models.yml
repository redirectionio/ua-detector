---

# The device axis: an entry answers for a model token wherever it appears and says nothing about
# the system or the client. `2109119DG` is a Mi 11 Lite 5G whether Chrome, Facebook or a podcast
# app is asking.
#
# Priority 2, after the entries that answer in full and after the catch-alls at 1.

-
  regex: '.*[;/ ]2109119DG[;)/ ].*'
  priority: -3
  device: {brand: 'Xiaomi', model: 'Mi 11 Lite 5G'}

-
  regex: '.*[;/ ]CPH2005[;)/ ].*'
  priority: -3
  device: {brand: 'OPPO', model: 'Find X2 Lite'}

# A model token that says TV is a television, whatever else is written around it: an Android
# set-top box reads as a phone otherwise.
-
  regex: '.*[(;] ?[^;)]*\bTV\b[^;)]*[;)].*'
  priority: -1
  device: {type: 'tv'}

# The Facebook applications write the device in their own bracket, and some send no platform
# token at all.
-
  regex: '.*FBMD/iPhone;.*'
  priority: -3
  device: {type: 'smartphone', brand: 'Apple'}

-
  regex: '.*FBMD/iPad;.*'
  priority: -3
  device: {type: 'tablet', brand: 'Apple'}

# HbbTV is the broadcast standard a television speaks, whatever Linux the string also names.
-
  regex: '.*HbbTV/[\d.]+.*'
  priority: -1
  device: {type: 'tv'}

# Amazon's Fire TV sticks and cubes name themselves by a code and nothing else. Shortest first,
# so `AFTSSS` lands on top of the `AFTSS` it opens with.
-
  regex: '.*(?:smarttv_)?AFTA(?:[);/ _].*|$)'
  priority: -1
  device: {type: 'tv', brand: 'Amazon', model: 'Fire TV Cube (Gen 1)'}

-
  regex: '.*(?:smarttv_)?AFTR(?:[);/ _].*|$)'
  priority: -1
  device: {type: 'tv', brand: 'Amazon', model: 'Fire TV Cube (Gen 2)'}

