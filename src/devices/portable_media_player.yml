---

# Apple iPod touch. The generation is only readable from the hardware identifier, when the
# user agent carries one at all.
-
  regex: 'Mozilla/5\.0 \(iPod; U; CPU iPhone OS (?<os_version>[\d_]+) like Mac OS X; [a-z]{2}-[a-z]{2}\) AppleWebKit/(?<engine_version>[\d.]+) \(KHTML, like Gecko\) Mobile/\w+'
  os:
    name: iOS
    version: "{os_version|dots}"
    platform: ""
  client:
    type: browser
    name: Mobile Safari
    version: ""
    engine: WebKit
    engine_version: "{engine_version}"
  device:
    type: portable media player
    brand: Apple
    model: iPod Touch
  os_family: iOS
  browser_family: Safari

-
  regex: 'iPodTouch7'
  os:
    name: iOS
    version: ""
    platform: ""
  client:
    type: browser
    name: Mobile Safari
    version: ""
    engine: WebKit
    engine_version: ""
  device:
    type: portable media player
    brand: Apple
    model: iPod Touch 7
  os_family: iOS
  browser_family: Safari

# iPod5,1 is the fifth generation, iPod7,1 the sixth: the hardware identifier runs ahead of
# the marketing name.
-
  regex: 'Mozilla/5\.0 \(iPod touch; CPU iPhone OS (?<os_version>[\d_]+) like Mac OS X\) AppleWebKit/[\d.]+ \(KHTML, like Gecko\) Mobile/\w+ Instagram (?<client_version>[\d.]+) \(iPod5,1;.*'
  os:
    name: iOS
    version: "{os_version|dots}"
    platform: ""
  client:
    type: mobile app
    name: Instagram
    version: "{client_version}"
  device:
    type: portable media player
    brand: Apple
    model: iPod Touch 5
  os_family: iOS
  browser_family: Unknown

