# Huawei SmartScreen running DingTalk. `Hmos/1` is what marks it as HarmonyOS rather than the
# Android version the user agent otherwise advertises.
-
  regex: 'Mozilla/5\.0 \(Linux; U; Android [\d.]+; [a-z]{2}-[A-Z]{2}; (?<model>BLM-00) Build/[\w-]+\) AppleWebKit/537\.36 \(KHTML, like Gecko\) Version/4\.0 Chrome/[\d.]+ UWS/[\d.]+ Mobile Safari/537\.36 AliApp\(DingTalk/(?<client_version>[\d.]+)\) com\.alibaba\.android\.rimet/\d+ Channel/\d+ language/[\w-]+ abi/\d+ Pad/APad Hmos/(?<os_version>\d+) UT4Aplus/[\d.]+ colorScheme/\w+'
  os:
    name: HarmonyOS
    version: "{os_version}.0.0"
    platform: ""
  client:
    type: mobile app
    name: DingTalk
    version: "{client_version}"
  device:
    type: smart display
    brand: Huawei
    model: "{model} SmartScreen"
  os_family: Android
  browser_family: Unknown

