# Crestron touch panel, announced by the Sonos player embedded in it
-
  regex: 'Linux UPnP/[\d.]+ Sonos/(?<client_version>\d+\.\d+)[-\d]* \(ACR_:(?<brand>[^:]+):[^)]+\)'
  os:
    name: Android
    version: ""
    platform: ""
  client:
    type: mediaplayer
    name: SONOS
    version: "{client_version}"
  device:
    type: smart display
    brand: "{brand}"
    model: ""
  os_family: Android
  browser_family: Unknown
