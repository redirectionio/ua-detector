---

# Acer DA series, Android Browser
-
  regex: 'Mozilla/5\.0 \(Linux; U; Android (?<os_version>[\d.]+); [a-z]{2}-[a-z]{2}; (?<model>DA\d{3}HQL) Build/[\w.]+\) AppleWebKit/(?<engine_version>[\d.]+) \(KHTML, like Gecko\) Version/4\.0 Safari/[\d.]+'
  os:
    name: Android
    version: "{os_version}"
    platform: ""
  client:
    type: browser
    name: Android Browser
    version: ""
    engine: WebKit
    engine_version: "{engine_version}"
  device:
    type: smart display
    brand: Acer
    model: "{model}"
  os_family: Android
  browser_family: Android Browser

# Acer DA series, Chrome
