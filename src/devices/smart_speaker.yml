-
  regex: 'Sonos/(?<client_version>\d+(?:\.\d+)?)\.?[-\d]* \((?<model>Play:\d+)\)'
  client:
    type: mediaplayer
    name: SONOS
    version: "{client_version}"
  device:
    type: smart speaker
    brand: SONOS
    model: "{model}"
  os_family: Unknown
  browser_family: Unknown

-
  regex: 'Sonos;Play(?<model>\d+);\w+;;tpapi;[\d.]+'
  device:
    type: smart speaker
    brand: SONOS
    model: "Play:{model}"
  os_family: Unknown
  browser_family: Unknown

-
  regex: 'Sonos;(?<model>One);\w+;;tpapi;[\d.]+'
  device:
    type: smart speaker
    brand: SONOS
    model: "{model}"
  os_family: Unknown
  browser_family: Unknown
