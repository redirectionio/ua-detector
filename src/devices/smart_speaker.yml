---

# Apple
-
  regex: 'AppleCoreMedia/[\w.]+ \(HomePod; U; CPU OS (?<os_version>[\d_]+) like Mac OS X; [a-z]{2}_[a-z]{2}\)'
  os:
    name: iOS
    version: "{os_version|dots}"
    platform: ""
  client:
    type: library
    name: iOS Application
    version: ""
  device:
    type: smart speaker
    brand: Apple
    model: HomePod
  os_family: iOS
  browser_family: Unknown

-
  regex: 'AirPlay/[\d.]+'
  os:
    name: iOS
    version: ""
    platform: ""
  device:
    type: smart speaker
    brand: Apple
    model: ""
  os_family: iOS
  browser_family: Unknown

# Amazon Echo. The device is identified by a five letter code, and the Fire OS release only
# shows through the Android version it is built on.
-
  regex: 'Dalvik/[\d.]+ \(Linux; U; Android 5\.1\.1; AEOBC Build/\w+\)'
  os:
    name: Fire OS
    version: "5"
    platform: ""
  client:
    type: browser
    name: Android Browser
    version: ""
    engine: WebKit
    engine_version: ""
  device:
    type: smart speaker
    brand: Amazon
    model: Echo
  os_family: Android
  browser_family: Android Browser

-
  regex: 'Mozilla/5\.0 \(Linux; Android 5\.1\.1; AEOKN Build/\w+; wv\) AppleWebKit/537\.36 \(KHTML, like Gecko\) Version/4\.0 Chrome/(?<client_version>[\d.]+) Safari/537\.36'
  os:
    name: Fire OS
    version: "5"
    platform: ""
  client:
    type: browser
    name: Chrome Webview
    version: "{client_version}"
    engine: Blink
    engine_version: "{client_version}"
  device:
    type: smart speaker
    brand: Amazon
    model: Echo
  os_family: Android
  browser_family: Chrome

-
  regex: 'Mozilla/5\.0 \(Linux; Android 7\.1\.2; AEOC[HW] Build/\w+; wv\) AppleWebKit/537\.36 \(KHTML, like Gecko\) Version/4\.0 Chrome/(?<client_version>[\d.]+) (?:Mobile )?Safari/537\.36'
  os:
    name: Fire OS
    version: "6"
    platform: ""
  client:
    type: browser
    name: Chrome Webview
    version: "{client_version}"
    engine: Blink
    engine_version: "{client_version}"
  device:
    type: smart speaker
    brand: Amazon
    model: Echo Show 8
  os_family: Android
  browser_family: Chrome

