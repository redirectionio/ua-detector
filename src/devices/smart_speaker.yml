# Sonos players, whose zone player code is the model. ANVIL and BR200 are the two exceptions.
-
  regex: 'Linux U[Pp]nP/[\d.]+ Sonos/(?<client_version>\d+(?:\.\d+)?)\.?[-\d]*(?:-manufacturing)? \(ANVIL\)'
  os:
    name: GNU/Linux
    version: ""
    platform: ""
  client:
    type: mediaplayer
    name: SONOS
    version: "{client_version}"
  device:
    type: smart speaker
    brand: SONOS
    model: Sub
  os_family: GNU/Linux
  browser_family: Unknown

-
  regex: 'Linux U[Pp]nP/[\d.]+ Sonos/(?<client_version>\d+(?:\.\d+)?)\.?[-\d]*(?:-manufacturing)? \(BR200\)'
  os:
    name: GNU/Linux
    version: ""
    platform: ""
  client:
    type: mediaplayer
    name: SONOS
    version: "{client_version}"
  device:
    type: smart speaker
    brand: SONOS
    model: BOOST
  os_family: GNU/Linux
  browser_family: Unknown

-
  regex: 'Linux U[Pp]nP/[\d.]+ Sonos/(?<client_version>\d+(?:\.\d+)?)\.?[-\d]*(?:-manufacturing)? \((?<model>ZPS?\d+)\)'
  os:
    name: GNU/Linux
    version: ""
    platform: ""
  client:
    type: mediaplayer
    name: SONOS
    version: "{client_version}"
  device:
