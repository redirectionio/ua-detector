---

# Every operating system the corpus knows, generated from `regexes/oss.yml` of the pinned
# revision: Fire OS, webOS, Symbian, Haiku, IRIX, Remix OS and three hundred more, where
# `systems.yml` reads the handful of platform tokens the traffic is made of.
#
# Priority -4, between the precise rungs of `systems.yml` at -3 and the catch-alls at -5, in
# matomo's order reversed. Rules using a lookaround or an anchor are left out, as are the eight
# whose version comes from a table rather than a capture.

-
  regex: '.*(?:Java ME|J2ME|Profile/MIDP|CLDC|Java; U; MIDP|MMP/\d\.\d).*'
  priority: -4
  os: {name: 'Java ME'}
  os_family: 'Real-time OS'
-
  regex: '.*(?:Linux[^a-z]|Cinnamon/(?:\d+[.\d]+)|(?:(?:i386|x86_64)-)?(?:pc|unknown)-linux-gnu|X11).*'
  priority: -4
  os: {name: 'GNU/Linux'}
  os_family: 'GNU/Linux'
-
  regex: '.*Linux/(?<os_version>\d+[.\d]+).*'
  priority: -4
  os: {name: 'GNU/Linux', version: "{os_version}", platform: ""}
  os_family: 'GNU/Linux'
-
  regex: '.*\bOS/2.*'
  priority: -4
  os: {name: 'OS/2'}
  os_family: 'IBM'
-
