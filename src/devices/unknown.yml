# Android on a model token that names nothing: a smartphone with no brand and no model, which is
# what the fixtures carrying an unrecognised one -- K6, Android_Device, `Iphone12 pro max` --
# report.
#
# Which Chrome it is comes off the two markers, not off the model: `wv` is a WebView whether or
# not it also says Version/4.0, Version/4.0 without `wv` is one too, and the plain string is
# Chrome Mobile. Priority 1, behind every entry that does know the model.

-
  regex: 'Mozilla/5\.0 \(Linux; (?:U; )?Android (?<os_version>[\d.]+); [^;)]+; wv\) AppleWebKit/[\d.]+ \(KHTML, like Gecko\) (?:Version/[\d.]+ )?Chrome/(?<client_version>(?:2[89]|[3-9]\d|\d{3,})\.[\d.]+) Mobile Safari/[\d.]+'
