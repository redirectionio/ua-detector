---

# CyanogenMod names itself in the build string
-
  regex: 'Mozilla/5\.0 \(Linux; U; Android (?<os_version>[\d.]+)[^;]*; [\w-]+; .*CyanogenMod.*\) AppleWebKit/(?<engine_version>[\d.]+) \(KHTML, like Gecko\) Version/[\d.]+ (?:Mobile )?Safari/[\d.]+'
  priority: -2
  os: {name: 'CyanogenMod', version: "{os_version}", platform: ""}
  client: {type: browser, name: 'Android Browser', version: "", engine: 'WebKit', engine_version: "{engine_version}"}
  device: {type: ''}
  os_family: 'Android'
  browser_family: 'Android Browser'

# Fallback: an Android build whose device token names nothing we know
-
  regex: 'Mozilla/5\.0 \(Linux; U; Android (?<os_version>[\d.]+)[^;]*; [\w-]+; .+?(?: Build/[^)]+)?\) AppleWebKit/(?<engine_version>[\d.]+) \(KHTML, like Gecko\) Version/[\d.]+ (?:Mobile )?Safari/[\d.]+'
  priority: -1
  os: {name: 'Android', version: "{os_version}", platform: ""}
  client: {type: browser, name: 'Android Browser', version: "", engine: 'WebKit', engine_version: "{engine_version}"}
  device: {type: ''}
  os_family: 'Android'
  browser_family: 'Android Browser'

