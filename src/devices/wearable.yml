---

# Apple Watch. The marketing name lives nowhere in the user agent, only the hardware
# identifier does, so each identifier has to be spelled out. Sizes come in pairs and the
# numbering runs ahead of the series: Watch2,6 is a Series 1, Watch6,10 an SE second
# generation.
-
  regex: 'Watch(?<code>1,1)/(?<os_version>[\d.]+) \(\w+\)'
  os: {name: watchOS, version: "{os_version}", platform: ARM}
  device: {type: wearable, brand: Apple, model: Watch 38mm}
  os_family: iOS
  browser_family: Unknown

-
  regex: 'Watch(?<code>1,2)/(?<os_version>[\d.]+) \(\w+\)'
  os: {name: watchOS, version: "{os_version}", platform: ARM}
  device: {type: wearable, brand: Apple, model: Watch 42mm}
  os_family: iOS
  browser_family: Unknown

-
  regex: 'atc/[\d.]+ watchOS/(?<os_version>[\d.]+) model/Watch(?:2,3) hwp/\w+ build/\w+ \([^)]*\)'
